[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "tkarcade"
dynamic = ["version"]
description = "Minimal Steam launch wrapper (env, exe override, GameMode, gamescope, MangoHud, ludusavi, pre/post, night light)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TKArcade contributors" }]
# Qt 6.12 is the first branch with the fixes for CVE-2026-8168 (SVG),
# CVE-2026-105923 (VectorImage) and CVE-2026-15037 (QDom): keep the floor.
dependencies = [
  "PySide6>=6.12",
  "vdf",
  "jeepney",
]

[project.optional-dependencies]
dev = []

# Dev tools via uv venv with system site packages (or system packages):
#   uv venv --system-site-packages && uv pip install --no-deps --no-build-isolation -e .

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "qml: offscreen QML suite (slow: one short-lived subprocess per case)",
]

# AppImage (single entry) via pyproject-appimage; see packaging/appimage/.
[tool.pyproject-appimage]
script = "tkarcade"
output = "TKArcade.AppImage"
icon = "src/tkarcade/icons/tkarcade.svg"
desktop-entry = "packaging/tkarcade.desktop"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9/F: syntax/style basics (E501 line length intentionally off).
# I/UP/B/RUF100/FURB/PERF: modern, bug-prone and perf patterns.
# RET/SIM/ERA/FLY/LOG/TCH/RUF022/A: return style, simplifications, dead
# code, f-strings, logging, typing-only imports, `__all__` order, builtin
# shadowing. SIM105 is off: our best-effort `try/except: pass` is deliberate.
# Broad excepts and silent fallbacks are a project idiom (the game must
# launch even when helpers fail); S/PL rules stay off for the same reason
# (returncode inspection and best-effort fallbacks).
# N (naming) stays off: the camelCase Qt slots the QML calls are the API
# (`hideOnClose`, `trayAction`, ...), not a style choice.
# C90 (mccabe) caps function complexity; the launch pipeline and the config
# validation are inherently branchy, so 9 is the ceiling the worst
# offenders (up to `launcher.main` at 52) were split down to.
select = [
  "E4", "E7", "E9", "F", "I", "UP", "B", "RUF100", "FURB", "PERF",
  "RET", "SIM", "ERA", "FLY", "LOG", "TCH", "RUF022", "A", "C90",
]
ignore = ["SIM105"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[project.scripts]
tkarcade = "tkarcade.launcher:main"

[tool.hatch.build.targets.wheel]
# translations/ holds no .py-adjacent code, only .qm catalogs: name the
# package explicitly so the files ship even if auto-discovery changes.
packages = ["src/tkarcade"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Tags like v0.3.0 drive releases; tarballs without git get the fallback.
fallback-version = "0.0.0"
