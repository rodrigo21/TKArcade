[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tksteamlaunch"
version = "0.1.0"
description = "Minimal Steam launch wrapper (env, exe override, GameMode, gamescope, MangoHud, ludusavi, pre/post, night light)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TKSteamLaunch contributors" }]
dependencies = [
  "PySide6",
  "vdf",
  "jeepney",
]

[project.optional-dependencies]
dev = []

# Dev tools come from system packages on CachyOS/Arch (no venv):
#   sudo pacman -S python-pytest ruff

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9/F: syntax/style basics (E501 line length intentionally off).
# I/UP/B/RUF100/FURB/PERF: modern, bug-prone and perf patterns.
# Broad excepts and silent fallbacks are a project idiom (the game must
# launch even when helpers fail); S/PL rules stay off for the same reason
# (returncode inspection and best-effort fallbacks).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100", "FURB", "PERF"]

[project.scripts]
tksteamlaunch = "tksteamlaunch.launcher:main"
tksteamlaunch-gui = "tksteamlaunch.gui.app:main"
tksteamlaunch-nightlight-holder = "tksteamlaunch.nightlight_holder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tksteamlaunch = ["py.typed"]
