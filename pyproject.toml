[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "tksteamlaunch"
dynamic = ["version"]
description = "Minimal Steam launch wrapper (env, exe override, GameMode, gamescope, MangoHud, ludusavi, pre/post, night light)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TKSteamLaunch contributors" }]
dependencies = [
  "PySide6",
  "vdf",
  "jeepney",
]

[project.optional-dependencies]
dev = []

# Dev tools via uv venv with system site packages (or system packages):
#   uv venv --system-site-packages && uv pip install --no-deps --no-build-isolation -e .

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# AppImage (launcher only) via pyproject-appimage; see packaging/appimage/.
[tool.pyproject-appimage]
script = "tksteamlaunch"
output = "TKSteamLaunch.AppImage"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9/F: syntax/style basics (E501 line length intentionally off).
# I/UP/B/RUF100/FURB/PERF: modern, bug-prone and perf patterns.
# Broad excepts and silent fallbacks are a project idiom (the game must
# launch even when helpers fail); S/PL rules stay off for the same reason
# (returncode inspection and best-effort fallbacks).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100", "FURB", "PERF"]

[project.scripts]
tksteamlaunch = "tksteamlaunch.launcher:main"
tksteamlaunch-gui = "tksteamlaunch.gui.app:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Tags like v0.3.0 drive releases; tarballs without git get the fallback.
fallback-version = "0.0.0"
